name: Build calendar

on:
  schedule:
    - cron: "17 10 * * *"   # daily, 06:17 Montréal (EDT) / 05:17 (EST)
  workflow_dispatch:
    inputs:
      debug:
        description: "Save raw source pages under debug/"
        type: boolean
        default: false
  push:
    branches: [main, claude/dreamy-noether-v4qzeq]
    paths-ignore:
      - "docs/**"
      - "debug/**"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build ICS files
        env:
          KARENDA_DEBUG: ${{ (github.event_name == 'push' || inputs.debug) && '1' || '0' }}
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name "karenda-bot"
          git config user.email "karenda-bot@users.noreply.github.com"
          git add docs debug 2>/dev/null || git add docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update calendar $(date -u +%Y-%m-%d)"
            git push
          fi
